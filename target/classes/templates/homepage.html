<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Online Course</title>
    <meta charset="UTF-8">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background: #f5f5f5;
        }

        .banner {
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            color: white;
            padding: 80px 20px;
            text-align: center;
        }

        .course-card {
            transition: 0.3s;
        }

        .course-card:hover {
            transform: translateY(-5px);
        }

        .course-img {
            height: 200px;
            object-fit: cover;
        }

        footer {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar(activePage='home')}"></div>

<!-- BANNER -->
<section class="banner">
    <h1>Học lập trình Online</h1>
    <p>Hơn 100+ khóa học chất lượng cao</p>

    <a href="/courses" class="btn btn-light btn-lg mt-3">
        Xem khóa học
    </a>
</section>

<!-- COURSE LIST -->
<div class="container mt-5">

    <h2 class="text-center mb-4">Khóa học nổi bật</h2>

    <div class="row">

        <!-- Nếu không có course -->
        <div th:if="${#lists.isEmpty(courses)}" class="text-center">
            <p>Chưa có khóa học nào</p>
        </div>

        <!-- Course item -->
        <div class="col-md-4 mb-4"
             th:each="course : ${courses}">

            <div class="card course-card h-100 shadow-sm">

                <img th:src="${course.image}"
                     class="card-img-top course-img"
                     alt="Course Image"
                     onerror="this.src='https://via.placeholder.com/400x200/6366f1/ffffff?text=No+Image'">

                <div class="card-body d-flex flex-column">

                    <h5 class="card-title"
                        th:text="${course.title}">
                    </h5>

                    <p class="card-text"
                       th:text="${course.description}">
                    </p>

                    <div class="mt-auto">

                        <h5 class="text-danger mb-2"
                            th:text="${course.price} + ' $'">
                        </h5>

                        <form th:if="${isLogged && !isAdmin}" th:action="@{'/cart/add/' + ${course.id}}" method="POST" class="mb-2">
                            <button type="submit" class="btn btn-danger w-100 rounded-pill fw-bold">
                                <i class="bi bi-cart-plus me-1"></i>Thêm vào giỏ hàng
                            </button>
                        </form>

                        <a th:href="@{'/courses/' + ${course.id}}"
                           class="btn btn-primary w-100">
                            Xem chi tiết
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- CATEGORY -->
<div class="container mt-5">

    <h2 class="text-center mb-4">Danh mục khóa học</h2>

    <div class="row text-center">

        <div class="col-md-3">
            <div class="card p-3 shadow-sm">
                <h5>Java</h5>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card p-3 shadow-sm">
                <h5>Web Development</h5>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card p-3 shadow-sm">
                <h5>Python</h5>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card p-3 shadow-sm">
                <h5>AI & Machine Learning</h5>
            </div>
        </div>

    </div>

</div>

<!-- FOOTER -->
<footer>
    <p>© 2026 OnlineCourse - Website bán khóa học</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
