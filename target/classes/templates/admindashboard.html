<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Admin Dashboard</title>
    <meta charset="UTF-8">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body {
            background: #f5f5f5;
        }

        .sidebar {
            height: 100vh;
            background: #212529;
            color: white;
            padding: 20px;
        }

        .sidebar a {
            color: white;
            display: block;
            margin: 10px 0;
            text-decoration: none;
        }

        .sidebar a:hover {
            color: #0d6efd;
        }

        .card {
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-2 sidebar">

            <h4>Admin</h4>
            <hr>

            <a href="/">Trang chủ</a>
            <a href="/admin/dashboard">Dashboard</a>
            <a href="/admin/users">Quản lý User</a>
            <a href="/admin/courses">Quản lý Khóa học</a>

            <hr>

            <div sec:authorize="isAuthenticated()">
                Xin chào,
                <b sec:authentication="name"></b>
            </div>

            <a href="/logout" class="btn btn-danger mt-3 w-100">Logout</a>

        </div>

        <!-- CONTENT -->
        <div class="col-md-10 p-4">

            <h2>Admin Dashboard</h2>
            <p>Chào mừng bạn đến trang quản trị</p>

            <div class="row mt-4">

                <div class="col-md-4">
                    <div class="card p-3 shadow">
                        <h5>Tổng Users</h5>
                        <h3 th:text="${totalUsers}">0</h3>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card p-3 shadow">
                        <h5>Tổng Khóa học</h5>
                        <h3 th:text="${totalCourses}">0</h3>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card p-3 shadow">
                        <h5>Doanh thu</h5>
                        <h3>$0</h3>
                    </div>
                </div>

            </div>

        </div>

    </div>
</div>

</body>
</html>
