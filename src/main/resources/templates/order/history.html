<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lịch sử mua hàng</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">OnlineCourse</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link" href="/courses">Khóa học</a></li>
                <li class="nav-item" th:if="${isLogged}"><a class="nav-link" href="/cart">Giỏ hàng</a></li>
                <li class="nav-item" th:if="${isLogged}"><a class="nav-link active" href="/orders/history">Lịch sử</a></li>
                
                <li class="nav-item" th:if="${!isLogged}"><a class="nav-link" href="/login">Đăng nhập</a></li>
                <li class="nav-item" th:if="${!isLogged}"><a class="nav-link" href="/register">Đăng ký</a></li>
                <li class="nav-item" th:if="${isAdmin}"><a class="nav-link text-warning fw-bold" href="/admin">⚡ Quản trị</a></li>
                <li class="nav-item" th:if="${isLogged}">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-link nav-link text-danger" style="text-decoration:none;">Đăng xuất</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="mb-4">Khóa học đã mua</h2>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <div class="row" th:if="${!#lists.isEmpty(orders)}">
        <div class="col-md-4 mb-4" th:each="order : ${orders}">
            <div class="card shadow-sm h-100 border-0">
                <img th:src="${order.course.image}" class="card-img-top" style="height: 180px; object-fit: cover;" alt="Course Image">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title fw-bold" th:text="${order.course.title}"></h5>
                    <p class="card-text text-muted small mb-3">Ngày mua: <span th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}"></span></p>
                    <div class="mt-auto">
                        <a th:href="@{'/courses/' + ${order.course.id}}" class="btn btn-outline-primary w-100 rounded-pill shadow-sm fw-bold">Vào học ngay</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(orders)}" class="text-center p-5 bg-white rounded shadow-sm">
        <h4 class="text-muted mb-3">Bạn chưa mua khóa học nào!</h4>
        <a href="/courses" class="btn btn-primary rounded-pill px-4 py-2">Khám phá khóa học ngay</a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
