<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lịch sử mua hàng | OnlineCourse</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .course-card { 
            border-radius: 16px; 
            transition: all 0.3s ease; 
            border: none;
            overflow: hidden;
        }
        .course-card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 12px 30px rgba(0,0,0,0.1) !important; 
        }
        .btn-pill { border-radius: 50px; padding: 10px 24px; font-weight: 600; }
        .card-img-top { height: 180px; object-fit: cover; }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar(activePage='history')}"></div>

<div class="container mt-5">
    <div class="d-flex align-items-center mb-5">
        <div class="bg-primary text-white rounded-4 p-3 me-3 shadow-sm">
            <i class="bi bi-journal-check fs-3"></i>
        </div>
        <div>
            <h2 class="mb-1 fw-bold text-dark">Khóa học đã mua</h2>
            <p class="text-muted mb-0">Theo dõi tiến độ học tập của bạn</p>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert alert-success rounded-4 border-0 shadow-sm mb-5" th:text="${successMessage}"></div>

    <div class="row" th:if="${!#lists.isEmpty(orders)}">
        <div class="col-md-4 mb-4" th:each="order : ${orders}">
            <div class="card course-card h-100 shadow-sm">
                <div class="position-relative">
                    <img th:src="${order.course.image}" class="card-img-top" alt="Course Image">
                    <div class="position-absolute bottom-0 end-0 m-3">
                        <span class="badge bg-success rounded-pill px-3 shadow-sm">Đã sở hữu</span>
                    </div>
                </div>
                <div class="card-body d-flex flex-column p-4">
                    <h5 class="card-title fw-bold text-dark mb-3" th:text="${order.course.title}"></h5>
                    <div class="d-flex align-items-center text-muted small mb-4">
                        <i class="bi bi-calendar3 me-2"></i>
                        <span>Ngày mua: </span>
                        <span class="ms-1 fw-medium" th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy')}"></span>
                    </div>
                    <div class="mt-auto">
                        <a th:href="@{'/courses/' + ${order.course.id}}" class="btn btn-primary btn-pill w-100 shadow-sm">
                            <i class="bi bi-play-fill me-1"></i>Vào học ngay
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(orders)}" class="text-center p-5 bg-white rounded-5 shadow-sm border border-light">
        <div class="display-1 text-muted mb-4"><i class="bi bi-journal-x"></i></div>
        <h4 class="text-muted mb-4 fw-semibold">Bạn chưa sở hữu khóa học nào</h4>
        <a href="/courses" class="btn btn-primary btn-pill shadow-sm">
            <i class="bi bi-search me-2"></i>Khám phá khóa học ngay
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
