<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả thanh toán | OnlineCourse</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .result-card { background: white; border-radius: 24px; padding: 40px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); max-width: 500px; width: 100%; text-align: center; }
        .status-icon { font-size: 5rem; margin-bottom: 20px; }
        .status-success { color: #10b981; }
        .status-error { color: #ef4444; }
        .order-details { background: #f1f5f9; border-radius: 16px; padding: 20px; margin: 24px 0; text-align: left; }
        .detail-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; }
        .detail-label { color: #64748b; }
        .detail-value { font-weight: 600; color: #1e293b; }
        .btn-primary { background: #6366f1; border: none; padding: 12px 32px; border-radius: 12px; font-weight: 700; transition: all 0.2s; }
        .btn-primary:hover { background: #4f46e5; transform: translateY(-2px); }
        .btn-outline-secondary { border-radius: 12px; padding: 12px 32px; font-weight: 600; }
    </style>
</head>
<body>

<div class="result-card">
    <div th:if="${status == 'SUCCESS'}">
        <div class="status-icon status-success">
            <i class="bi bi-check-circle-fill"></i>
        </div>
        <h2 class="fw-800 mb-2">Thanh toán thành công!</h2>
        <p class="text-muted">Cảm ơn bạn đã tin tưởng dịch vụ của chúng tôi.</p>
    </div>

    <div th:if="${status == 'FAILED'}">
        <div class="status-icon status-error">
            <i class="bi bi-x-circle-fill"></i>
        </div>
        <h2 class="fw-800 mb-2">Thanh toán thất bại</h2>
        <p class="text-muted" th:text="${message}">Giao dịch không thành công hoặc bị hủy bỏ.</p>
    </div>

    <div class="order-details">
        <div class="detail-item">
            <span class="detail-label">Mã thanh toán:</span>
            <span class="detail-value" th:text="${paymentCode}">-</span>
        </div>
        <div class="detail-item" th:if="${transactionId}">
            <span class="detail-label">Mã giao dịch:</span>
            <span class="detail-value" th:text="${transactionId}">-</span>
        </div>
        <div class="detail-item">
            <span class="detail-label">Số tiền:</span>
            <span class="detail-value text-primary" th:text="${@currencyUtils.formatVnd(amount)}">0 VNĐ</span>
        </div>
        <div class="detail-item">
            <span class="detail-label">Nội dung:</span>
            <span class="detail-value" th:text="${orderInfo}">Mua khóa học</span>
        </div>
    </div>

    <div class="d-grid gap-2">
        <a th:if="${status == 'SUCCESS'}" href="/orders/history" class="btn btn-primary">Xem khóa học đã mua</a>
        <a th:if="${status == 'FAILED'}" href="/cart" class="btn btn-primary">Thử lại</a>
        <a href="/" class="btn btn-outline-secondary">Về trang chủ</a>
    </div>
</div>

</body>
</html>
