<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đăng nhập | OnlineCourse</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
            padding: 2.5rem;
            transition: transform 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
        }

        .brand-logo {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            display: block;
            text-align: center;
        }

        .form-label {
            font-weight: 600;
            color: #475569;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .input-group-text {
            background-color: #f8fafc;
            border-right: none;
            color: #94a3b8;
            border-radius: 12px 0 0 12px;
        }

        .form-control {
            border-left: none;
            background-color: #f8fafc;
            border-radius: 0 12px 12px 0;
            padding: 12px 16px;
            font-size: 1rem;
            border: 1px solid #e2e8f0;
        }

        .form-control:focus {
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
            border-color: #2563eb;
        }

        .form-control:focus + .input-group-text {
            border-color: #2563eb;
        }

        .btn-login {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            border: none;
            border-radius: 50px;
            padding: 14px;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 25px -5px rgba(37, 99, 235, 0.4);
        }

        .alert-auth {
            border-radius: 12px;
            border: none;
            font-weight: 500;
            padding: 1rem;
            font-size: 0.9rem;
        }

        .divider {
            height: 1px;
            background: #e2e8f0;
            margin: 2rem 0;
            position: relative;
        }

        .divider span {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            padding: 0 10px;
            color: #94a3b8;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <span class="brand-logo">🎓</span>
        <h2 class="text-center fw-bold text-dark mb-4">Chào mừng trở lại</h2>
        <p class="text-center text-muted mb-5">Vui lòng đăng nhập để tiếp tục hành trình học tập của bạn.</p>

        <!-- ERROR MESSAGE -->
        <div th:if="${param.error}" class="alert alert-danger alert-auth mb-4 d-flex align-items-center">
            <i class="bi bi-exclamation-circle-fill me-2 fs-5"></i>
            <span>Email hoặc mật khẩu không chính xác!</span>
        </div>

        <!-- LOGOUT MESSAGE -->
        <div th:if="${param.logout}" class="alert alert-success alert-auth mb-4 d-flex align-items-center">
            <i class="bi bi-check-circle-fill me-2 fs-5"></i>
            <span>Bạn đã đăng xuất an toàn. Hẹn gặp lại!</span>
        </div>

        <form method="post" action="/login">
            <div class="mb-4">
                <label class="form-label">Email tài khoản</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="username" class="form-control" placeholder="example@onlinecourse.com" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center">
                    <label class="form-label">Mật khẩu</label>
                    <a href="#" class="small text-primary text-decoration-none fw-semibold">Quên mật khẩu?</a>
                </div>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="●●●●●●●●" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-login w-100 mb-4 text-white">
                Đăng nhập ngay
            </button>
        </form>

        <div class="divider">
            <span>Hoặc bạn là thành viên mới?</span>
        </div>

        <div class="text-center">
            <a href="/register" class="btn btn-outline-primary rounded-pill w-100 fw-bold py-3">
                Đăng ký tài khoản mới
            </a>
            <a href="/" class="d-block mt-4 text-muted text-decoration-none small fw-medium">
                <i class="bi bi-arrow-left me-1"></i> Quay về Trang chủ
            </a>
        </div>
    </div>

</body>
</html>
