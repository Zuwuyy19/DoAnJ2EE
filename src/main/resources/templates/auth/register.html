<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đăng ký thành viên | OnlineCourse</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at bottom right, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .register-card {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
            padding: 2.5rem;
        }

        .brand-logo {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            display: block;
            text-align: center;
        }

        .form-label {
            font-weight: 600;
            color: #475569;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
        }

        .input-group-text {
            background-color: #f8fafc;
            border-right: none;
            color: #94a3b8;
            border-radius: 12px 0 0 12px;
        }

        .form-control {
            border-left: none;
            background-color: #f8fafc;
            border-radius: 0 12px 12px 0;
            padding: 12px 16px;
            font-size: 0.95rem;
            border: 1px solid #e2e8f0;
        }

        .form-control:focus {
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
            border-color: #10b981;
        }

        .btn-register {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            border-radius: 50px;
            padding: 14px;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3);
            transition: all 0.3s ease;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(16, 185, 129, 0.4);
        }

        .alert-auth {
            border-radius: 12px;
            border: none;
            font-weight: 500;
            padding: 1rem;
            font-size: 0.85rem;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 1.5rem;
        }

        .step-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e2e8f0;
        }

        .step-dot.active {
            width: 24px;
            border-radius: 4px;
            background: #10b981;
        }
    </style>
</head>

<body>

    <div class="register-card">
        <span class="brand-logo">🌱</span>
        <h2 class="text-center fw-bold text-dark mb-2">Bắt đầu hành trình</h2>
        <p class="text-center text-muted mb-4 small">Trở thành một phần của cộng đồng học tập lớn nhất.</p>

        <div class="step-indicator">
            <div class="step-dot active"></div>
            <div class="step-dot"></div>
            <div class="step-dot"></div>
        </div>

        <!-- SUCCESS MESSAGE -->
        <div th:if="${param.success}" class="alert alert-success alert-auth mb-4 d-flex align-items-center">
            <i class="bi bi-check-circle-fill me-2 fs-5"></i>
            <span>🎉 Đăng ký thành công! Bạn có thể đăng nhập ngay.</span>
        </div>

        <!-- ERROR MESSAGE -->
        <div th:if="${param.error}" class="alert alert-danger alert-auth mb-4 d-flex align-items-center">
            <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
            <span>Đăng ký thất bại. Email có thể đã tồn tại!</span>
        </div>

        <form method="post" action="/auth/register">
            <div class="mb-3">
                <label class="form-label">Email đăng ký</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="email" class="form-control" placeholder="example@gmail.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Mật khẩu bảo mật</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Tối thiểu 6 ký tự" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Xác nhận mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                    <input type="password" name="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu" required>
                </div>
            </div>

            <div class="form-check mb-4 small">
                <input class="form-check-input" type="checkbox" value="" id="termsCheck" required>
                <label class="form-check-label text-muted" for="termsCheck">
                    Tôi đồng ý với <a href="#" class="text-primary text-decoration-none fw-semibold">Điều khoản dịch vụ</a> và <a href="#" class="text-primary text-decoration-none fw-semibold">Chính sách bảo mật</a>.
                </label>
            </div>

            <button type="submit" class="btn btn-success btn-register w-100 mb-4 text-white">
                Đăng ký tài khoản
            </button>
        </form>

        <div class="text-center">
            <p class="text-muted small mb-0">Bạn đã là thành viên?</p>
            <a href="/login" class="text-primary text-decoration-none fw-bold">
                Đăng nhập tại đây <i class="bi bi-arrow-right ms-1"></i>
            </a>
            
            <div class="mt-4 pt-3 border-top">
                <a href="/" class="text-muted text-decoration-none small">
                    <i class="bi bi-house me-1"></i> Về Trang chủ
                </a>
            </div>
        </div>
    </div>

</body>
</html>
