<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Danh sách Khóa học</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">OnlineCourse</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link active" href="/courses">Khóa học</a></li>
                <li class="nav-item" th:if="${isLogged}"><a class="nav-link" href="/cart">Giỏ hàng</a></li>
                <li class="nav-item" th:if="${isLogged}"><a class="nav-link" href="/orders/history">Lịch sử</a></li>
                
                <li class="nav-item" th:if="${!isLogged}"><a class="nav-link" href="/login">Đăng nhập</a></li>
                <li class="nav-item" th:if="${!isLogged}"><a class="nav-link" href="/register">Đăng ký</a></li>
                <li class="nav-item" th:if="${isAdmin}"><a class="nav-link text-warning fw-bold" href="/admin">⚡ Quản trị</a></li>
                <li class="nav-item" th:if="${isLogged}">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-link nav-link text-danger" style="text-decoration:none;">Đăng xuất</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="text-center mb-4 fw-bold">Thư viện Khóa học</h2>
    
    <div class="row">
        <!-- Sidebar Danh mục -->
        <div class="col-md-3">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white fw-bold">Danh mục</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item text-muted" th:if="${#lists.isEmpty(categories)}">Trống</li>
                    <li class="list-group-item" th:each="cat : ${categories}">
                        <a href="#" class="text-decoration-none text-dark fw-semibold" th:text="${cat.name}">Category</a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Khóa học -->
        <div class="col-md-9">
            <div class="row">
                <div th:if="${#lists.isEmpty(courses)}" class="col-12"><p class="text-muted text-center mt-5">Chưa có khóa học nào</p></div>
                
                <div class="col-md-4 mb-4" th:each="course : ${courses}">
                    <div class="card h-100 shadow-sm border-0">
                        <img th:src="${course.image}" class="card-img-top" alt="Course Image" style="height: 180px; object-fit: cover;" onerror="this.src='https://via.placeholder.com/400x180/6366f1/ffffff?text=No+Image'">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title fw-bold" th:text="${course.title}"></h5>
                            <p class="card-text text-muted small" th:text="${course.category != null ? course.category.name : 'Khác'}"></p>
                            <div class="mt-auto">
                                <h5 class="text-danger fw-bold mb-2" th:text="${@currencyUtils.formatVnd(course.price)}"></h5>
                                <button type="button" class="btn btn-danger w-100 rounded-pill fw-bold mb-2"
                                        th:if="${isLogged && !isAdmin}"
                                        th:attr="onclick=|addToCartAjax(${course.id}, this)|">
                                    <i class="bi bi-cart-plus me-1"></i>Thêm vào giỏ hàng
                                </button>
                                <a th:href="@{'/courses/' + ${course.id}}" class="btn btn-outline-primary w-100 rounded-pill fw-semibold">
                                    <i class="bi bi-search me-1"></i>Khám phá ngay
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </div>
</div>

<!-- Toast notification -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999;">
    <div id="cartToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body" id="toastMessage">Thành công!</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script>
    var cartToast;
    document.addEventListener('DOMContentLoaded', function() {
        cartToast = new bootstrap.Toast(document.getElementById('cartToast'), { delay: 3000 });
    });
    function showToast(message, isSuccess) {
        var toastEl = document.getElementById('cartToast');
        var toastMsg = document.getElementById('toastMessage');
        toastMsg.textContent = message;
        toastEl.className = 'toast align-items-center border-0 ' + (isSuccess ? 'text-bg-success' : 'text-bg-danger');
        cartToast = new bootstrap.Toast(toastEl, { delay: 3000 });
        cartToast.show();
    }
    function addToCartAjax(courseId, btn) {
        var originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Đang thêm...';
        fetch('/cart/add/' + courseId, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' } })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            btn.disabled = false;
            btn.innerHTML = originalText;
            showToast(data.message, data.success);
        })
        .catch(function() {
            btn.disabled = false;
            btn.innerHTML = originalText;
            showToast('Có lỗi xảy ra!', false);
        });
    }
</script>

</body>
</html>
