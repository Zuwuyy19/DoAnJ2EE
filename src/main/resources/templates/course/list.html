<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Danh sách Khóa học</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar(activePage='courses')}"></div>

<div class="container mt-5">
    <h2 class="text-center mb-4 fw-bold">Thư viện Khóa học</h2>
    
    <div class="row">
        <!-- Sidebar Danh mục -->
        <div class="col-md-3">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white fw-bold">Danh mục</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item" th:if="${!#lists.isEmpty(categories)}">
                        <a th:href="@{'/courses'(q=${q}, minRating=${minRating})}"
                           class="text-decoration-none fw-semibold"
                           th:classappend="${categoryId == null} ? 'text-primary' : 'text-dark'">
                            Tất cả
                        </a>
                    </li>
                    <li class="list-group-item text-muted" th:if="${#lists.isEmpty(categories)}">Trống</li>
                    <li class="list-group-item" th:each="cat : ${categories}">
                        <a th:href="@{'/courses'(categoryId=${cat.id}, q=${q}, minRating=${minRating})}"
                           class="text-decoration-none fw-semibold"
                           th:classappend="${categoryId == cat.id} ? 'text-primary' : 'text-dark'"
                           th:text="${cat.name}">Category</a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Khóa học -->
        <div class="col-md-9">
            <form class="row g-2 mb-3" method="get" action="/courses">
                <input type="hidden" name="categoryId" th:value="${categoryId}">
                <div class="col-md-7">
                    <input type="text" name="q" class="form-control" placeholder="Tìm kiếm khóa học..."
                           th:value="${q}">
                </div>
                <div class="col-md-3">
                    <select class="form-select" name="minRating">
                        <option th:selected="${minRating == null}" value="">Chọn đánh giá</option>
                        <option value="5" th:selected="${minRating == 5}">Từ 5 sao</option>
                        <option value="4" th:selected="${minRating == 4}">Từ 4 sao</option>
                        <option value="3" th:selected="${minRating == 3}">Từ 3 sao</option>
                        <option value="2" th:selected="${minRating == 2}">Từ 2 sao</option>
                        <option value="1" th:selected="${minRating == 1}">Từ 1 sao</option>
                    </select>
                </div>
                <div class="col-md-2 d-grid">
                    <button type="submit" class="btn btn-primary">Lọc</button>
                </div>
            </form>
            <div class="row">
                <div th:if="${#lists.isEmpty(courses)}" class="col-12"><p class="text-muted text-center mt-5">Chưa có khóa học nào</p></div>
                
                <div class="col-md-4 mb-4" th:each="course : ${courses}">
                    <div class="card h-100 shadow-sm border-0">
                        <img th:src="${course.image}" class="card-img-top" alt="Course Image" style="height: 180px; object-fit: cover;" onerror="this.src='https://via.placeholder.com/400x180/6366f1/ffffff?text=No+Image'">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title fw-bold" th:text="${course.title}"></h5>
                            <p class="card-text text-muted small" th:text="${course.category != null ? course.category.name : 'Khác'}"></p>
                            <div class="text-muted small mb-2" th:if="${courseAvgRatings[course.id] != null}">
                                <i class="bi bi-star-fill text-warning me-1"></i>
                                <span th:text="${#numbers.formatDecimal(courseAvgRatings[course.id], 1, 'POINT', 1, 'POINT')}">5.0</span>
                            </div>
                            <div class="text-muted small mb-2" th:if="${courseAvgRatings[course.id] == null}">
                                Chưa có đánh giá
                            </div>
                            <div class="mt-auto">
                                <h5 class="text-danger fw-bold mb-2" th:text="${course.price} + ' $'"></h5>
                                <form th:if="${isLogged && !isAdmin}" th:action="@{'/cart/add/' + ${course.id}}" method="POST" class="mb-2">
                                    <button type="submit" class="btn btn-danger w-100 rounded-pill fw-bold">
                                        <i class="bi bi-cart-plus me-1"></i>Thêm vào giỏ hàng
                                    </button>
                                </form>
                                <a th:href="@{'/courses/' + ${course.id}}" class="btn btn-outline-primary w-100 rounded-pill fw-semibold">
                                    <i class="bi bi-search me-1"></i>Khám phá ngay
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </div>
</div>

</body>
</html>
