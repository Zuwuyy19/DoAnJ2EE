<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý Người dùng - Admin | OnlineCourse</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .card { border-radius: 16px; border: none; }
        .badge-role { border-radius: 50px; padding: 5px 12px; font-weight: 600; font-size: 0.75rem; }
        .bg-role-admin { background-color: #fee2e2; color: #ef4444; }
        .bg-role-user { background-color: #dcfce7; color: #22c55e; }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{fragments/admin_navbar :: admin_navbar(activePage='users')}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1 text-dark">Quản lý Người dùng</h2>
            <p class="text-muted mb-0">Xem và quản lý quyền hạn của các thành viên</p>
        </div>
    </div>

    <div class="card shadow-sm border-0 overflow-hidden">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light text-secondary">
                        <tr>
                            <th class="ps-4 py-3">ID</th>
                            <th class="py-3">Email</th>
                            <th class="py-3">Quyền hạn</th>
                            <th class="py-3">Trạng thái</th>
                            <th class="text-end pe-4 py-3">Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td class="ps-4">
                                <span class="fw-medium text-secondary" th:text="'#' + ${user.id}"></span>
                            </td>
                            <td>
                                <div class="d-flex align-items-center">
                                    <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-3 shadow-sm" style="width: 40px; height: 40px;">
                                        <span th:text="${#strings.substring(user.email,0,1).toUpperCase()}">U</span>
                                    </div>
                                    <span class="fw-semibold text-dark" th:text="${user.email}">user@example.com</span>
                                </div>
                            </td>
                            <td>
                                <div class="d-flex gap-1 flex-wrap">
                                    <span th:each="role : ${user.roles}" 
                                          th:text="${role.name}"
                                          class="badge-role"
                                          th:classappend="${role.name == 'ROLE_ADMIN' ? 'bg-role-admin' : 'bg-role-user'}">
                                    </span>
                                </div>
                            </td>
                            <td>
                                <span th:if="${user.enabled}" class="badge bg-success rounded-pill px-3 py-2 small">Hoạt động</span>
                                <span th:if="${!user.enabled}" class="badge bg-danger rounded-pill px-3 py-2 small">Đã khóa</span>
                            </td>
                            <td class="text-end pe-4">
                                <div class="btn-group">
                                    <a th:href="@{'/admin/users/edit/' + ${user.id}}" class="btn btn-sm btn-outline-primary rounded-pill px-3 me-2">
                                        <i class="bi bi-pencil-square me-1"></i>Sửa
                                    </a>
                                    <a th:if="${user.enabled}" th:href="@{'/admin/users/delete/' + ${user.id}}" class="btn btn-sm btn-outline-danger rounded-pill px-3" onclick="return confirm('Bạn có chắc chắn muốn KHÓA tài khoản này?')">
                                        <i class="bi bi-lock me-1"></i>Khóa
                                    </a>
                                    <span th:if="${!user.enabled}" class="text-muted small italic">Đã bị khóa</span>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="4" class="text-center py-5 text-muted italic">Chưa có người dùng nào được tìm thấy.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
