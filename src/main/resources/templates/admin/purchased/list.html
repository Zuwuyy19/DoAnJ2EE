<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quan ly Khoa hoc da mua - Admin</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/admin">Admin Panel</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/courses">khóa học</a></li>
                <li class="nav-item"><a class="nav-link active" href="/admin/purchased-courses">Khóa học đã mua</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold">Danh sách Khóa học đã mua</h2>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-3">ID</th>
                        <th>Tên</th>
                        <th>Giá</th>
                        <th>Lượt mua</th>
                        <th>Lần mua gần nhất</th>
                        <th>Chi tiết</th>
                        <th class="text-end pe-3">Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${purchasedCourses}">
                        <td class="ps-3" th:text="${item.courseId}"></td>
                        <td>
                            <div class="fw-bold" th:text="${item.courseName}"></div>
                            <div class="small text-muted" th:text="${item.courseTitle}"></div>
                        </td>
                        <td class="fw-bold text-danger" th:text="${item.price} + ' $'"></td>
                        <td th:text="${item.purchaseCount}"></td>
                        <td th:text="${item.lastPurchaseDate}">-</td>
                        <td>
                            <span class="badge bg-success" th:if="${item.hasDetail}">Đã có chi tiết</span>
                            <span class="badge bg-secondary" th:if="${!item.hasDetail}">Chưa có chi tiết</span>
                        </td>
                        <td class="text-end pe-3">
                            <a th:href="@{'/admin/purchased-courses/edit/' + ${item.courseId}}"
                               class="btn btn-sm btn-outline-secondary">Xem chi tiết</a>
                            <a th:href="@{'/admin/purchased-courses/edit/' + ${item.courseId}}"
                               class="btn btn-sm btn-primary">Cập nhật</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(purchasedCourses)}">
                        <td colspan="7" class="text-center py-4 text-muted">Chưa có khóa học nào.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
