<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý Nội dung & Lượt mua - Admin | OnlineCourse</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .card { border-radius: 16px; border: none; }
        .btn-pill { border-radius: 50px; }
        .table-hover tbody tr:hover { background-color: #f1f5f9; cursor: default; }
        .badge-success { background-color: #dcfce7; color: #15803d; font-weight: 600; }
        .badge-warning { background-color: #fef9c3; color: #854d0e; font-weight: 600; }
        .badge-info { background-color: #e0f2fe; color: #0369a1; font-weight: 600; }
        .badge-price { background-color: #fef2f2; color: #dc2626; font-weight: 700; }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{fragments/admin_navbar :: admin_navbar(activePage='purchased')}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-dark mb-1">Quản lý Nội dung & Lượt mua</h2>
            <p class="text-muted mb-0">Theo dõi doanh số và cập nhật nội dung cho học viên</p>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th class="ps-4 py-3">ID</th>
                            <th class="py-3">Thông tin khóa học</th>
                            <th class="py-3">Giá bán</th>
                            <th class="py-3 text-center">Lượt mua</th>
                            <th class="py-3">Mua gần nhất</th>
                            <th class="py-3 text-center">Trạng thái nội dung</th>
                            <th class="text-end pe-4 py-3">Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${purchasedCourses}">
                            <td class="ps-4">
                                <span class="badge bg-light text-secondary border fw-medium" th:text="'#' + ${item.courseId}">#0</span>
                            </td>
                            <td>
                                <div class="d-flex align-items-center">
                                    <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-3 shadow-sm" style="width: 40px; height: 40px; background-color: #6366f1 !important;">
                                        <i class="bi bi-journal-check"></i>
                                    </div>
                                    <div>
                                        <div class="fw-bold text-dark" th:text="${item.courseName}">Course Name</div>
                                        <div class="small text-muted" th:text="${item.courseTitle}">Course Title</div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <span class="badge badge-price px-3 py-2" th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0 VNĐ</span>
                            </td>
                            <td class="text-center">
                                <span class="badge badge-info rounded-pill px-3 py-2" th:text="${item.purchaseCount}">0</span>
                            </td>
                            <td>
                                <div class="d-flex align-items-center gap-2 small text-muted">
                                    <i class="bi bi-clock-history"></i>
                                    <span th:text="${item.lastPurchaseDate != null ? item.lastPurchaseDate : 'Chưa có'}">Date</span>
                                </div>
                            </td>
                            <td class="text-center">
                                <span class="badge badge-success px-3 py-2" th:if="${item.hasDetail}">
                                    <i class="bi bi-check-circle me-1"></i>Đã có chi tiết
                                </span>
                                <span class="badge badge-warning px-3 py-2" th:if="${!item.hasDetail}">
                                    <i class="bi bi-exclamation-circle me-1"></i>Chưa có chi tiết
                                </span>
                            </td>
                            <td class="text-end pe-4">
                                <a th:href="@{'/admin/courses/' + ${item.courseId} + '/content'}"
                                   class="btn btn-sm btn-outline-primary btn-pill px-3 shadow-sm" title="Cập nhật chương trình học">
                                    <i class="bi bi-pencil-square me-1"></i>Cập nhật nội dung
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(purchasedCourses)}">
                            <td colspan="7" class="text-center py-5 text-muted">
                                <i class="bi bi-cart-x fs-1 d-block mb-3 opacity-50"></i>
                                Chưa có khóa học nào được mua.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
