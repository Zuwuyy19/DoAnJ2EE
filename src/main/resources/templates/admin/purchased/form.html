<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cập nhật Nội dung - Admin | OnlineCourse</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .card { border-radius: 20px; border: none; overflow: hidden; }
        .form-label { font-weight: 600; color: #4b5563; }
        .form-control { border-radius: 12px; padding: 12px 16px; border: 1px solid #e5e7eb; }
        .form-control:focus { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
        .btn-pill { border-radius: 50px; padding: 12px 24px; font-weight: 700; }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{fragments/admin_navbar :: admin_navbar(activePage='purchased')}"></div>

<div class="container-fluid px-lg-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-6">
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/admin/purchased-courses" class="text-decoration-none">Quản lý Lượt mua</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Cập nhật nội dung</li>
                </ol>
            </nav>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-bottom p-4">
                    <div class="d-flex align-items-center">
                        <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-3 shadow-sm" style="width: 48px; height: 48px; background-color: #6366f1 !important;">
                            <i class="bi bi-journal-plus fs-4"></i>
                        </div>
                        <div>
                            <h4 class="fw-bold text-dark mb-0">Thiết lập nội dung chuyên sâu</h4>
                            <p class="text-muted mb-0" th:text="${course.name}">Course Name</p>
                        </div>
                    </div>
                </div>
                <div class="card-body p-4 p-lg-5">
                    <form th:action="@{/admin/purchased-courses/save}" method="POST" enctype="multipart/form-data">
                        <input type="hidden" name="courseId" th:value="${course.id}">

                        <div class="mb-4">
                            <label class="form-label mb-2">Thông tin chi tiết (Hiển thị sau khi mua)</label>
                            <textarea name="purchasedDetail" class="form-control" rows="8"
                                      placeholder="Mô tả chi tiết, hướng dẫn hoặc lời chào mừng dành riêng cho học viên đã sở hữu khóa học này..."
                                      th:text="${course.purchasedDetail}"></textarea>
                        </div>

                        <hr class="my-5 opacity-10">
                        <h5 class="fw-bold mb-4 text-dark"><i class="bi bi-cloud-upload me-2 text-primary"></i>Tài nguyên đính kèm</h5>

                        <div class="row g-4">
                            <div class="col-12">
                                <label class="form-label mb-2">Video độc quyền (MP4, MKV...)</label>
                                <input type="file" name="purchasedVideoFile" class="form-control" accept="video/*">
                                <div class="mt-2" th:if="${course.purchasedVideoUrl != null and !#strings.isEmpty(course.purchasedVideoUrl)}">
                                    <span class="badge bg-success-subtle text-success rounded-pill px-3 fw-medium">
                                        <i class="bi bi-check-circle-fill me-1"></i>Đã có Video: 
                                        <a th:href="${course.purchasedVideoUrl}" target="_blank" class="text-decoration-none">Xem lại</a>
                                    </span>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label mb-2">Tài liệu Word (DOCX)</label>
                                <input type="file" name="purchasedDocFile" class="form-control" accept=".doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
                                <div class="mt-2" th:if="${course.purchasedDocUrl != null and !#strings.isEmpty(course.purchasedDocUrl)}">
                                    <span class="badge bg-info-subtle text-info rounded-pill px-3 fw-medium">
                                        <i class="bi bi-file-earmark-word-fill me-1"></i>Đã có tài liệu: 
                                        <a th:href="${course.purchasedDocUrl}" target="_blank" class="text-decoration-none">Tải xuống</a>
                                    </span>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label mb-2">Slide PowerPoint (PPTX)</label>
                                <input type="file" name="purchasedPptFile" class="form-control" accept=".ppt,.pptx,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation">
                                <div class="mt-2" th:if="${course.purchasedPptUrl != null and !#strings.isEmpty(course.purchasedPptUrl)}">
                                    <span class="badge bg-warning-subtle text-warning rounded-pill px-3 fw-medium">
                                        <i class="bi bi-file-earmark-ppt-fill me-1"></i>Đã có slide: 
                                        <a th:href="${course.purchasedPptUrl}" target="_blank" class="text-decoration-none">Tải xuống</a>
                                    </span>
                                </div>
                            </div>
                        </div>

                        <hr class="my-5 opacity-10">

                        <div class="d-flex gap-3">
                            <button type="submit" class="btn btn-primary btn-pill flex-grow-1 shadow-sm">
                                <i class="bi bi-check-circle me-2"></i>Cập nhật nội dung
                            </button>
                            <a href="/admin/purchased-courses" class="btn btn-outline-secondary btn-pill px-4">
                                Quay lại
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
