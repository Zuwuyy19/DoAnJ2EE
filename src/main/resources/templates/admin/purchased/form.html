<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cập nhật nội dung khóa học - Admin</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/admin">Admin Panel</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/admin/purchased-courses">Về danh sách</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white fw-bold py-3">
                    Cập nhật nội dung cho khóa học
                </div>
                <div class="card-body p-4">
                    <div class="mb-3">
                        <div class="fw-bold" th:text="${course.name}">Course name</div>
                        <div class="small text-muted" th:text="${course.title}">Course title</div>
                    </div>

                    <form th:action="@{/admin/purchased-courses/save}" method="POST" enctype="multipart/form-data">
                        <input type="hidden" name="courseId" th:value="${course.id}">

                        <div class="mb-4">
                            <label class="form-label fw-bold">Chi tiết khóa học</label>
                            <textarea name="purchasedDetail" class="form-control" rows="6"
                                      placeholder="Nội dung chi tiết cho khóa học..."
                                      th:text="${course.purchasedDetail}"></textarea>
                        </div>
                        <div class="mb-4" th:if="${course.purchasedVideoUrl != null or course.purchasedDocUrl != null or course.purchasedPptUrl != null}">
                            <div class="fw-bold mb-2">Tài liệu đã upload</div>
                            <div class="d-flex flex-column gap-2">
                                <div th:if="${course.purchasedVideoUrl != null and !#strings.isEmpty(course.purchasedVideoUrl)}">
                                    Video: <a th:href="${course.purchasedVideoUrl}" target="_blank">Xem video</a>
                                </div>
                                <div th:if="${course.purchasedDocUrl != null and !#strings.isEmpty(course.purchasedDocUrl)}">
                                    Word: <a th:href="${course.purchasedDocUrl}" target="_blank">Xem tài liệu</a>
                                </div>
                                <div th:if="${course.purchasedPptUrl != null and !#strings.isEmpty(course.purchasedPptUrl)}">
                                    PowerPoint: <a th:href="${course.purchasedPptUrl}" target="_blank">Xem tài liệu</a>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Video (Upload)</label>
                            <input type="file" name="purchasedVideoFile" class="form-control" accept="video/*">
                            <div class="form-text" th:if="${course.purchasedVideoUrl != null and !#strings.isEmpty(course.purchasedVideoUrl)}">
                                Hiện Tại: <a th:href="${course.purchasedVideoUrl}" target="_blank">Xem video</a>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Tài liệu Word (Upload)</label>
                            <input type="file" name="purchasedDocFile" class="form-control" accept=".doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
                            <div class="form-text" th:if="${course.purchasedDocUrl != null and !#strings.isEmpty(course.purchasedDocUrl)}">
                                Hiện Tại: <a th:href="${course.purchasedDocUrl}" target="_blank">Xem tài liệu</a>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Tài liệu PowerPoint (Upload)</label>
                            <input type="file" name="purchasedPptFile" class="form-control" accept=".ppt,.pptx,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation">
                            <div class="form-text" th:if="${course.purchasedPptUrl != null and !#strings.isEmpty(course.purchasedPptUrl)}">
                                Hiện Tại: <a th:href="${course.purchasedPptUrl}" target="_blank">Xem tài liệu</a>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg fw-bold">Lưu chi tiết</button>
                            <a href="/admin/purchased-courses" class="btn btn-outline-secondary">Hủy bỏ</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
