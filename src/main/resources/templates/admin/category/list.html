<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý Danh mục - Admin | OnlineCourse</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .card { border-radius: 16px; border: none; }
        .btn-pill { border-radius: 50px; }
        .table-hover tbody tr:hover { background-color: #f1f5f9; cursor: default; }
        .badge-count { background-color: #e2e8f0; color: #475569; font-weight: 600; }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{fragments/admin_navbar :: admin_navbar(activePage='categories')}"></div>

<div class="container-fluid px-lg-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-11 col-xl-10">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold text-dark mb-1">Quản lý Danh mục</h2>
                    <p class="text-muted mb-0">Tổ chức và phân loại các khóa học</p>
                </div>
                <a href="/admin/categories/new" class="btn btn-primary btn-pill px-4 shadow-sm">
                    <i class="bi bi-plus-lg me-2"></i>Thêm Danh mục
                </a>
            </div>

            <!-- Alert Messages -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show rounded-4 border-0 shadow-sm mb-4" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show rounded-4 border-0 shadow-sm mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light">
                            <tr>
                                <th class="ps-4 py-3" style="width: 100px;">ID</th>
                                <th class="py-3">Tên Danh mục</th>
                                <th class="py-3 text-center">Số lượng khóa học</th>
                                <th class="text-end pe-4 py-3">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cat : ${categories}">
                                <td class="ps-4">
                                    <span class="badge bg-light text-secondary border fw-medium" th:text="'#' + ${cat.id}">#0</span>
                                </td>
                                <td>
                                    <div class="d-flex align-items-center">
                                        <div class="bg-soft-primary rounded-3 p-2 me-3 d-flex" style="background-color: #eff6ff">
                                            <i class="bi bi-folder2-open text-primary fs-5"></i>
                                        </div>
                                        <span class="fw-bold text-dark" th:text="${cat.name}">Category Name</span>
                                    </div>
                                </td>
                                <td class="text-center">
                                    <span class="badge badge-count rounded-pill px-3 py-2" th:text="${cat.courses != null ? #lists.size(cat.courses) : 0}">0</span>
                                </td>
                                <td class="text-end pe-4">
                                    <a th:href="@{'/admin/categories/edit/' + ${cat.id}}" class="btn btn-sm btn-outline-primary btn-pill px-3 me-2">
                                        <i class="bi bi-pencil-square me-1"></i>Sửa
                                    </a>
                                    <a th:href="@{'/admin/categories/delete/' + ${cat.id}}" class="btn btn-sm btn-outline-danger btn-pill px-3" 
                                       onclick="return confirm('Bạn có chắc chắn muốn xóa danh mục này? Các khóa học trong danh mục sẽ KHÔNG bị xóa mà chỉ trở về trạng thái chưa phân loại.')">
                                        <i class="bi bi-trash me-1"></i>Xóa
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(categories)}">
                                <td colspan="4" class="text-center py-5 text-muted">
                                    <i class="bi bi-inbox fs-1 d-block mb-3 opacity-50"></i>
                                    Chưa có danh mục nào được tạo.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
