<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý Danh mục - Admin</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/admin">Admin Panel</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/courses">Khóa học</a></li>
                <li class="nav-item"><a class="nav-link active" href="/admin/categories">Danh mục</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="fw-bold">Danh sách Danh mục</h2>
                <a href="/admin/categories/new" class="btn btn-primary">+ Thêm mới</a>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light">
                            <tr>
                                <th class="ps-3" style="width: 100px;">ID</th>
                                <th>Tên Danh mục</th>
                                <th class="text-end pe-3">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cat : ${categories}">
                                <td class="ps-3" th:text="${cat.id}"></td>
                                <td class="fw-bold" th:text="${cat.name}">Category Name</td>
                                <td class="text-end pe-3">
                                    <a th:href="@{'/admin/categories/edit/' + ${cat.id}}" class="btn btn-sm btn-info text-white">Sửa</a>
                                    <a th:href="@{'/admin/categories/delete/' + ${cat.id}}" class="btn btn-sm btn-danger" onclick="return confirm('Bạn có chắc chắn muốn xóa? Thao tác này có thể ảnh hưởng đến các khóa học thuộc danh mục này.')">Xoa</a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(categories)}">
                                <td colspan="3" class="text-center py-4 text-muted">Chưa có danh mục nào. Đang khởi tạo...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
