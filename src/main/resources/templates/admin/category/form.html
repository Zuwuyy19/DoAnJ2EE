<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thêm/Sửa Danh mục - Admin | OnlineCourse</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .card { border-radius: 20px; border: none; overflow: hidden; }
        .form-label { font-weight: 600; color: #4b5563; }
        .form-control { border-radius: 12px; padding: 12px 16px; border: 1px solid #e5e7eb; }
        .form-control:focus { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
        .btn-pill { border-radius: 50px; padding: 12px 24px; font-weight: 700; }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{fragments/admin_navbar :: admin_navbar(activePage='categories')}"></div>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/admin/categories" class="text-decoration-none">Danh mục</a></li>
                    <li class="breadcrumb-item active" aria-current="page" th:text="${category.id == null ? 'Thêm mới' : 'Chỉnh sửa'}"></li>
                </ol>
            </nav>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-bottom p-4">
                    <div class="d-flex align-items-center">
                        <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-3 shadow-sm" style="width: 48px; height: 48px;">
                            <i th:class="${category.id == null ? 'bi bi-plus-lg fs-4' : 'bi bi-pencil-square fs-4'}"></i>
                        </div>
                        <h4 class="fw-bold text-dark mb-0" th:text="${category.id == null ? 'Thêm danh mục mới' : 'Chỉnh sửa danh mục'}"></h4>
                    </div>
                </div>
                <div class="card-body p-4 p-lg-5">
                    <form th:action="@{/admin/categories/save}" th:object="${category}" method="POST">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-5">
                            <label class="form-label mb-2">Tên Danh mục</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="VD: Lập trình Java, Marketing..." required>
                            <div class="form-text mt-2">Tên danh mục nên ngắn gọn và súc tích để học viên dễ tìm kiếm.</div>
                        </div>

                        <div class="d-flex gap-3">
                            <button type="submit" class="btn btn-primary btn-pill flex-grow-1 shadow-sm">
                                <i class="bi bi-check-circle me-2"></i>Lưu thay đổi
                            </button>
                            <a href="/admin/categories" class="btn btn-outline-secondary btn-pill px-4">
                                Hủy bỏ
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
