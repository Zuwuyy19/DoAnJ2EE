<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Trang Quản Trị - Admin | OnlineCourse</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .stat-card {
            border-radius: 20px;
            border: none;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .content-card {
            border-radius: 20px;
            border: none;
        }
    </style>
</head>

<body class="bg-light">

    <div th:replace="~{fragments/admin_navbar :: admin_navbar(activePage='dashboard')}"></div>

    <div class="container mt-5">
        <div class="d-flex align-items-center mb-5">
            <div class="bg-primary text-white rounded-4 p-3 me-3 shadow-sm">
                <i class="bi bi-speedometer2 fs-3"></i>
            </div>
            <div>
                <h2 class="mb-1 fw-bold text-dark">Dashboard Quản trị</h2>
                <p class="text-muted mb-0">Tổng quan hệ thống OnlineCourse</p>
            </div>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-md-4">
                <div class="card stat-card text-white bg-primary shadow-sm h-100">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="fs-5 fw-medium opacity-75">Tổng Khóa học</span>
                            <i class="bi bi-journal-text fs-2"></i>
                        </div>
                        <h2 class="display-5 fw-bold mb-0" th:text="${courseCount}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card text-white bg-success shadow-sm h-100">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="fs-5 fw-medium opacity-75">Tổng Danh mục</span>
                            <i class="bi bi-collection fs-2"></i>
                        </div>
                        <h2 class="display-5 fw-bold mb-0" th:text="${categoryCount}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card text-white bg-warning shadow-sm h-100">
                    <div class="card-body p-4 text-dark">
<div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="fs-5 fw-medium opacity-75">Người dùng</span>
                            <i class="bi bi-people fs-2"></i>
                        </div>
                        <h2 class="display-5 fw-bold mb-0" th:text="${userCount}">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="card content-card shadow-sm mb-5">
            <div class="card-body p-5">
                <h5 class="card-title fw-bold text-dark mb-4"><i class="bi bi-info-circle me-2 text-primary"></i>Trạng
                    thái hệ thống</h5>
                <div class="alert alert-info border-0 rounded-4 p-4 mb-0">
                    <p class="mb-0 fs-6">Mọi thứ đang hoạt động bình thường. Phân quyền Middleware Controller đã
                        hoạt động hoàn tất nhiệm vụ chặn request không có quyền <strong>ROLE_ADMIN</strong>.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
