<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Trang Quản Trị - Admin | OnlineCourse</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .stat-card {
            border-radius: 20px;
            border: none;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .content-card {
            border-radius: 20px;
            border: none;
        }
    </style>
</head>

<body class="bg-light">

    <div th:replace="~{fragments/admin_navbar :: admin_navbar(activePage='dashboard')}"></div>

    <div class="container mt-5">
        <div class="d-flex align-items-center mb-5">
            <div class="bg-primary text-white rounded-4 p-3 me-3 shadow-sm">
                <i class="bi bi-speedometer2 fs-3"></i>
            </div>
            <div>
                <h2 class="mb-1 fw-bold text-dark">Dashboard Quản trị</h2>
                <p class="text-muted mb-0">Tổng quan hệ thống OnlineCourse</p>
            </div>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-md-4">
                <div class="card stat-card text-white bg-primary shadow-sm h-100">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="fs-5 fw-medium opacity-75">Tổng Khóa học</span>
                            <i class="bi bi-journal-text fs-2"></i>
                        </div>
                        <h2 class="display-5 fw-bold mb-0" th:text="${courseCount}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card text-white bg-success shadow-sm h-100">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="fs-5 fw-medium opacity-75">Tổng Danh mục</span>
                            <i class="bi bi-collection fs-2"></i>
                        </div>
                        <h2 class="display-5 fw-bold mb-0" th:text="${categoryCount}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card text-white bg-warning shadow-sm h-100">
                    <div class="card-body p-4 text-dark">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="fs-5 fw-medium opacity-75">Người dùng</span>
                            <i class="bi bi-people fs-2"></i>
                        </div>
                        <h2 class="display-5 fw-bold mb-0" th:text="${userCount}">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="card content-card shadow-sm mb-5">
            <div class="card-body p-5">
                <div class="d-flex flex-wrap align-items-center justify-content-between mb-4">
                    <h5 class="card-title fw-bold text-dark mb-0"><i class="bi bi-graph-up-arrow me-2 text-primary"></i>Doanh thu</h5>
                    <form method="get" action="/admin" class="d-flex flex-wrap align-items-center gap-2">
                        <select class="form-select form-select-sm" name="period">
                            <option value="day" th:selected="${period == 'day'}">Theo ngày</option>
                            <option value="week" th:selected="${period == 'week'}">Theo tuần</option>
                            <option value="month" th:selected="${period == 'month'}">Theo tháng</option>
                            <option value="year" th:selected="${period == 'year'}">Theo năm</option>
                        </select>
                        <input type="date" class="form-control form-control-sm"
                               name="startDate" th:value="${startDate}" data-period="range">
                        <input type="date" class="form-control form-control-sm"
                               name="endDate" th:value="${endDate}" data-period="range">
                        <input type="month" class="form-control form-control-sm"
                               name="monthValue" data-period="month"
                               th:value="${monthValue}">
                        <input type="number" class="form-control form-control-sm"
                               name="yearValue" data-period="year" min="2000" max="2100"
                               th:value="${yearValue}">
                        <input type="date" class="form-control form-control-sm"
                               name="singleDate"
                               data-period="day"
                               th:value="${day != null && month != null && year != null ? T(java.time.LocalDate).of(year, month, day) : null}">
                        <button type="submit" class="btn btn-sm btn-outline-primary">Xem</button>
                    </form>
                </div>
                <canvas id="revenueChart" height="120"></canvas>
            </div>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-lg-6">
                <div class="card content-card shadow-sm h-100">
                    <div class="card-body p-4">
                        <h5 class="card-title fw-bold text-dark mb-3"><i class="bi bi-award me-2 text-warning"></i>Top khóa học</h5>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item d-flex justify-content-between align-items-center"
                                th:each="item : ${topCourses}">
                                <span th:text="${item.title}">Course</span>
                                <span class="badge bg-light text-dark border" th:text="${#numbers.formatDecimal(item.revenue, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0 VNĐ</span>
                            </li>
                            <li class="list-group-item text-muted" th:if="${#lists.isEmpty(topCourses)}">Chưa có dữ liệu</li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card content-card shadow-sm h-100">
                    <div class="card-body p-4">
                        <h5 class="card-title fw-bold text-dark mb-3"><i class="bi bi-people me-2 text-success"></i>Top người dùng</h5>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item d-flex justify-content-between align-items-center"
                                th:each="item : ${topUsers}">
                                <span th:text="${item.email}">user@email.com</span>
                                <span class="badge bg-light text-dark border" th:text="${#numbers.formatDecimal(item.revenue, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0 VNĐ</span>
                            </li>
                            <li class="list-group-item text-muted" th:if="${#lists.isEmpty(topUsers)}">Chưa có dữ liệu</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script th:inline="javascript">
        const labels = /*[[${revenueLabels}]]*/ [];
        const values = /*[[${revenueValues}]]*/ [];
        const ctx = document.getElementById('revenueChart');
        if (ctx) {
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        label: 'Doanh thu',
                        data: values,
                        borderColor: '#4f46e5',
                        backgroundColor: 'rgba(79,70,229,0.15)',
                        fill: true,
                        tension: 0.35
                    }]
                },
                options: {
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }
        const periodSelect = document.querySelector('select[name="period"]');
        const rangeInputs = document.querySelectorAll('[data-period="range"]');
        const monthInput = document.querySelector('[data-period="month"]');
        const yearInput = document.querySelector('[data-period="year"]');
        const dayInput = document.querySelector('[data-period="day"]');

        function togglePeriodInputs() {
            const value = periodSelect ? periodSelect.value : 'month';
            rangeInputs.forEach(el => el.style.display = value === 'week' ? '' : 'none');
            if (monthInput) monthInput.style.display = value === 'month' ? '' : 'none';
            if (yearInput) yearInput.style.display = value === 'year' ? '' : 'none';
            if (dayInput) dayInput.style.display = value === 'day' ? '' : 'none';
        }
        if (periodSelect) {
            togglePeriodInputs();
            periodSelect.addEventListener('change', togglePeriodInputs);
        }
    </script>
</body>

</html>
