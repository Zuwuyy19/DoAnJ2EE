<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Trang Quản Trị - Admin | OnlineCourse</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .stat-card {
            border-radius: 20px;
            border: none;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .content-card {
            border-radius: 20px;
            border: none;
        }

        .filter-bar .input-group-text {
            border-color: #e2e8f0;
            color: #64748b;
        }

        .filter-bar .form-control, .filter-bar .form-select {
            border-color: #e2e8f0;
            color: #1e293b;
        }

        .filter-bar .form-control:focus, .filter-bar .form-select:focus {
            box-shadow: none;
            border-color: #3b82f6;
        }
    </style>
</head>

<body class="bg-light">

    <div th:replace="~{fragments/admin_navbar :: admin_navbar(activePage='dashboard')}"></div>

    <div class="container mt-5">
        <div class="d-flex align-items-center mb-5">
            <div class="bg-primary text-white rounded-4 p-3 me-3 shadow-sm">
                <i class="bi bi-speedometer2 fs-3"></i>
            </div>
            <div>
                <h2 class="mb-1 fw-bold text-dark">Dashboard Quản trị</h2>
                <p class="text-muted mb-0">Tổng quan hệ thống OnlineCourse</p>
            </div>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-md-4">
                <div class="card stat-card text-white bg-primary shadow-sm h-100">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="fs-5 fw-medium opacity-75">Tổng Khóa học</span>
                            <i class="bi bi-journal-text fs-2"></i>
                        </div>
                        <h2 class="display-5 fw-bold mb-0" th:text="${courseCount}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card text-white bg-success shadow-sm h-100">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="fs-5 fw-medium opacity-75">Tổng Danh mục</span>
                            <i class="bi bi-collection fs-2"></i>
                        </div>
                        <h2 class="display-5 fw-bold mb-0" th:text="${categoryCount}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card text-white bg-warning shadow-sm h-100">
                    <div class="card-body p-4 text-dark">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="fs-5 fw-medium opacity-75">Người dùng</span>
                            <i class="bi bi-people fs-2"></i>
                        </div>
                        <h2 class="display-5 fw-bold mb-0" th:text="${userCount}">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="card content-card shadow-sm mb-5">
            <div class="card-body p-5">
                <div class="d-flex flex-wrap align-items-center justify-content-between mb-4">
                    <h5 class="fw-bold text-dark mb-0"><i class="bi bi-graph-up-arrow me-2 text-primary"></i>Biểu đồ Doanh thu</h5>
                    <form method="get" action="/admin" class="filter-bar d-flex flex-wrap align-items-center gap-3">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-funnel-fill text-muted"></i></span>
                            <select class="form-select form-select-sm border-start-0 ps-0 fw-medium" name="period" style="width: 140px; cursor: pointer;">
                                <option value="day" th:selected="${period == 'day'}">Từng ngày</option>
                                <option value="week" th:selected="${period == 'week'}">Theo tuần</option>
                                <option value="month" th:selected="${period == 'month'}">Tháng cụ thể</option>
                                <option value="year" th:selected="${period == 'year'}">Theo năm</option>
                            </select>
                        </div>

                        <!-- Date range for week/custom -->
                        <div class="input-group input-group-sm" data-period="range">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-calendar-range text-muted"></i></span>
                            <input type="date" class="form-control form-control-sm border-start-0 border-end-0 ps-0" name="startDate" th:value="${startDate}" title="Ngày bắt đầu">
                            <span class="input-group-text bg-white border-start-0 border-end-0 text-muted px-1">→</span>
                            <input type="date" class="form-control form-control-sm border-start-0 ps-0" name="endDate" th:value="${endDate}" title="Ngày kết thúc">
                        </div>

                        <!-- Specific Month -->
                        <div class="input-group input-group-sm" data-period="month">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-calendar-event text-muted"></i></span>
                            <input type="month" class="form-control form-control-sm border-start-0 ps-0" name="monthValue" th:value="${monthValue}">
                        </div>

                        <!-- Specific Year -->
                        <div class="input-group input-group-sm" data-period="year">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-calendar-fill text-muted"></i></span>
                            <input type="number" class="form-control form-control-sm border-start-0 ps-0" name="yearValue" min="2000" max="2100" th:value="${yearValue}" placeholder="Năm">
                        </div>

                        <!-- Specific Day -->
                        <div class="input-group input-group-sm" data-period="day">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-calendar-check text-muted"></i></span>
                            <input type="date" class="form-control form-control-sm border-start-0 ps-0" name="singleDate"
                                th:value="${day != null && month != null && year != null ? T(java.time.LocalDate).of(year, month, day) : null}">
                        </div>

                        <button type="submit" class="btn btn-primary btn-sm px-4 rounded-3 shadow-sm border-0">
                            <i class="bi bi-search me-1"></i>Xem lọc
                        </button>
                    </form>
                </div>
                <div class="p-2 bg-light rounded-4 border border-opacity-10 mb-2">
                    <canvas id="revenueChart" height="120"></canvas>
                </div>
            </div>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-lg-6">
                <div class="card content-card shadow-sm h-100 border-0">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h5 class="fw-bold text-dark mb-0"><i class="bi bi-award me-2 text-warning"></i>Top khóa học</h5>
                            <span class="badge bg-soft-warning text-warning rounded-pill px-3 py-1" style="background-color: #fffbeb">Bán chạy nhất</span>
                        </div>
                        <div class="list-group list-group-flush border-top-0">
                            <div class="list-group-item d-flex justify-content-between align-items-center py-3 border-start-0 border-end-0 px-0"
                                th:each="item : ${topCourses}">
                                <div class="d-flex align-items-center">
                                    <div class="bg-light rounded-3 p-2 me-3">
                                        <i class="bi bi-journal-check text-primary"></i>
                                    </div>
                                    <span class="fw-medium text-dark" th:text="${item.title}">Course Title</span>
                                </div>
                                <span class="badge bg-light text-primary border rounded-pill px-3 py-2 fw-bold" th:text="${@currencyUtils.formatVnd(item.revenue)}">0 VNĐ</span>
                            </div>
                            <div class="list-group-item text-center py-5 text-muted border-0" th:if="${#lists.isEmpty(topCourses)}">
                                <i class="bi bi-inbox fs-2 d-block mb-2 opacity-25"></i>
                                Chưa có dữ liệu khóa học
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card content-card shadow-sm h-100 border-0">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h5 class="fw-bold text-dark mb-0"><i class="bi bi-people me-2 text-success"></i>Top người dùng</h5>
                            <span class="badge bg-soft-success text-success rounded-pill px-3 py-1" style="background-color: #f0fdf4">Chi tiêu nhiều nhất</span>
                        </div>
                        <div class="list-group list-group-flush border-top-0">
                            <div class="list-group-item d-flex justify-content-between align-items-center py-3 border-start-0 border-end-0 px-0"
                                th:each="item : ${topUsers}">
                                <div class="d-flex align-items-center">
                                    <div class="bg-light rounded-3 p-2 me-3">
                                        <i class="bi bi-person-badge text-success"></i>
                                    </div>
                                    <span class="fw-medium text-dark" th:text="${item.email}">user@email.com</span>
                                </div>
                                <span class="badge bg-light text-success border rounded-pill px-3 py-2 fw-bold" th:text="${@currencyUtils.formatVnd(item.revenue)}">0 VNĐ</span>
                            </div>
                            <div class="list-group-item text-center py-5 text-muted border-0" th:if="${#lists.isEmpty(topUsers)}">
                                <i class="bi bi-person-x fs-2 d-block mb-2 opacity-25"></i>
                                Chưa có dữ liệu người dùng
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script th:inline="javascript">
        const labels = /*[[${revenueLabels}]]*/ [];
        const values = /*[[${revenueValues}]]*/ [];
        const ctx = document.getElementById('revenueChart');
        if (ctx) {
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        label: 'Doanh thu',
                        data: values,
                        borderColor: '#4f46e5',
                        backgroundColor: 'rgba(79,70,229,0.15)',
                        fill: true,
                        tension: 0.35
                    }]
                },
                options: {
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }
        const periodSelect = document.querySelector('select[name="period"]');
        const rangeInputs = document.querySelectorAll('[data-period="range"]');
        const monthInput = document.querySelector('[data-period="month"]');
        const yearInput = document.querySelector('[data-period="year"]');
        const dayInput = document.querySelector('[data-period="day"]');

        function togglePeriodInputs() {
            const value = periodSelect ? periodSelect.value : 'month';
            rangeInputs.forEach(el => {
                el.classList.toggle('d-none', value !== 'week');
                el.classList.toggle('d-flex', value === 'week');
            });
            if (monthInput) {
                monthInput.classList.toggle('d-none', value !== 'month');
                monthInput.classList.toggle('d-flex', value === 'month');
            }
            if (yearInput) {
                yearInput.classList.toggle('d-none', value !== 'year');
                yearInput.classList.toggle('d-flex', value === 'year');
            }
            if (dayInput) {
                dayInput.classList.toggle('d-none', value !== 'day');
                dayInput.classList.toggle('d-flex', value === 'day');
            }
        }
        if (periodSelect) {
            togglePeriodInputs();
            periodSelect.addEventListener('change', togglePeriodInputs);
        }
    </script>
</body>

</html>
