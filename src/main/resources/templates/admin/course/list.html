<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý Khóa học - Admin | OnlineCourse</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .card { border-radius: 16px; border: none; }
        .btn-pill { border-radius: 50px; }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{fragments/admin_navbar :: admin_navbar(activePage='courses')}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold">Danh sách Khóa học</h2>
        <a href="/admin/courses/new" class="btn btn-primary rounded-pill px-4">
            <i class="bi bi-plus-lg me-2"></i>Thêm mới
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-3">ID</th>
                        <th>Hình ảnh</th>
                        <th>Tên & Tiêu đề</th>
                        <th>Danh mục</th>
                        <th>Giá</th>
                        <th class="text-end pe-3">Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="course : ${courses}">
                        <td class="ps-3" th:text="${course.id}"></td>
                        <td>
                            <img th:src="${course.image}" class="rounded" style="width: 80px; height: 50px; object-fit: cover;" onerror="this.src='https://via.placeholder.com/80x50/6366f1/ffffff?text=N/A'">
                        </td>
                        <td>
                            <div class="fw-bold" th:text="${course.name}"></div>
                            <div class="small text-muted" th:text="${course.title}"></div>
                        </td>
                        <td th:text="${course.category != null ? course.category.name : 'Chưa phân loại'}"></td>
                        <td class="fw-bold text-danger" th:text="${course.price} + ' $'"></td>
                        <td class="text-end pe-3">
                            <a th:href="@{'/courses/' + ${course.id}}" class="btn btn-sm btn-outline-secondary rounded-pill" target="_blank" title="Xem trước">
                                <i class="bi bi-eye"></i>
                            </a>
                            <a th:href="@{'/admin/courses/edit/' + ${course.id}}" class="btn btn-sm btn-warning text-white rounded-pill">Sửa</a>
                            <a th:href="@{'/admin/courses/delete/' + ${course.id}}" class="btn btn-sm btn-outline-danger rounded-pill" onclick="return confirm('Bạn có chắc chắn muốn xóa?')">Xóa</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(courses)}">
                        <td colspan="6" class="text-center py-4 text-muted">Chưa có khóa học nào được tạo.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
