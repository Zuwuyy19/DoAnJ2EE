<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thêm/Sửa Khóa học - Admin</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/admin">Admin Panel</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/admin/courses">Về danh sách</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white fw-bold py-3">
                    <span th:text="${course.id == null ? '➕ Thêm khóa học mới' : '📝 Chỉnh sửa khóa học'}"></span>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/courses/save}" th:object="${course}" method="POST">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label fw-bold">Tên khóa học (Name)</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="VD: Java Basic" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Tiêu đề hiển thị (Title)</label>
                            <input type="text" th:field="*{title}" class="form-control" placeholder="VD: Lập trình Java cơ bản đến nâng cao" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Danh mục</label>
                            <select th:field="*{category.id}" class="form-select" required>
                                <option value="" disabled selected>-- Chọn danh mục --</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Giá bán (VND)</label>
                                <input type="number" step="1" th:field="*{price}" class="form-control" placeholder="VD: 199000" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Đường dẫn ảnh (Image URL)</label>
                                <input type="text" th:field="*{image}" class="form-control" placeholder="VD: https://..." required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Mô tả khóa học</label>
                            <textarea th:field="*{description}" class="form-control" rows="5" placeholder="Mô tả chi tiết nội dung khóa học..."></textarea>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg fw-bold">Lưu khóa học</button>
                            <a href="/admin/courses" class="btn btn-outline-secondary">Hủy bỏ</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
