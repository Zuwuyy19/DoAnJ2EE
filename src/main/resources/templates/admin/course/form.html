<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thêm/Sửa Khóa học - Admin | OnlineCourse</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .card { border-radius: 16px; border: none; overflow: hidden; }
        .btn-pill { border-radius: 50px; }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{fragments/admin_navbar :: admin_navbar(activePage='courses')}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white fw-bold py-3">
                    <span th:text="${course.id == null ? '➕ Thêm khóa học mới' : '📝 Chỉnh sửa khóa học'}"></span>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/courses/save}" th:object="${course}" method="POST" enctype="multipart/form-data">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label fw-bold">Tên khóa học (Name)</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="VD: Java Basic" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Tiêu đề hiển thị (Title)</label>
                            <input type="text" th:field="*{title}" class="form-control" placeholder="VD: Lập trình Java cơ bản đến nâng cao" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Danh mục</label>
                            <select th:field="*{category.id}" class="form-select" required>
                                <option value="" disabled selected>-- Chọn danh mục --</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Giá bán ($)</label>
                                <input type="number" step="0.01" th:field="*{price}" class="form-control" placeholder="VD: 99.99" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Đường dẫn ảnh (Image URL)</label>
                                <input type="text" th:field="*{image}" class="form-control" placeholder="VD: https://..." required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Video giới thiệu khóa học (Upload)</label>
                            <input type="file" name="courseVideoFile" class="form-control" accept="video/*">
                            <div class="form-text" th:if="${course.videoUrl != null and !#strings.isEmpty(course.videoUrl)}">
                                Hiện tại: <a th:href="${course.videoUrl}" target="_blank">Xem video</a>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Mô tả khóa học</label>
                            <textarea th:field="*{description}" class="form-control" rows="5" placeholder="Mô tả chi tiết nội dung khóa học..."></textarea>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg fw-bold">Lưu khóa học</button>
                            <a href="/admin/courses" class="btn btn-outline-secondary">Hủy bỏ</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
