<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thêm/Sửa Khóa học - Admin | OnlineCourse</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .card { border-radius: 20px; border: none; overflow: hidden; }
        .form-label { font-weight: 600; color: #4b5563; }
        .form-control, .form-select { border-radius: 12px; padding: 12px 16px; border: 1px solid #e5e7eb; }
        .form-control:focus, .form-select:focus { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
        .btn-pill { border-radius: 50px; padding: 12px 24px; font-weight: 700; }
        .section-title { font-size: 1.1rem; font-weight: 700; color: #1f2937; margin-bottom: 1.5rem; display: flex; align-items: center; }
        .section-title i { margin-right: 10px; color: #6366f1; }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{fragments/admin_navbar :: admin_navbar(activePage='courses')}"></div>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-9">
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/admin/courses" class="text-decoration-none">Khóa học</a></li>
                    <li class="breadcrumb-item active" aria-current="page" th:text="${course.id == null ? 'Thêm mới' : 'Chỉnh sửa'}"></li>
                </ol>
            </nav>

            <div class="card shadow-sm border-0 mb-5">
                <div class="card-header bg-white border-bottom p-4">
                    <div class="d-flex align-items-center">
                        <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-3 shadow-sm" style="width: 48px; height: 48px; background-color: #6366f1 !important;">
                            <i th:class="${course.id == null ? 'bi bi-plus-lg fs-4' : 'bi bi-pencil-square fs-4'}"></i>
                        </div>
                        <div>
                            <h4 class="fw-bold text-dark mb-0" th:text="${course.id == null ? 'Thêm khóa học mới' : 'Thiết lập khóa học'}"></h4>
                            <p class="text-muted small mb-0" th:if="${course.id != null}" th:text="'ID: #' + ${course.id}"></p>
                        </div>
                    </div>
                </div>
                <div class="card-body p-4 p-lg-5">
                    <form th:action="@{/admin/courses/save}" th:object="${course}" method="POST" enctype="multipart/form-data">
                        <input type="hidden" th:field="*{id}">

                        <!-- SECTION: BASIC INFO -->
                        <div class="section-title">
                            <i class="bi bi-info-circle-fill"></i> Thông tin cơ bản
                        </div>
                        <div class="row g-4 mb-5">
                            <div class="col-md-6 text-start">
                                <label class="form-label">Tên rút gọn (Name)</label>
                                <input type="text" th:field="*{name}" class="form-control" placeholder="VD: Java Basic" required>
                                <div class="form-text">Dùng để hiển thị trong các danh sách ngắn.</div>
                            </div>
                            <div class="col-md-6 text-start">
                                <label class="form-label">Tiêu đề đầy đủ (Title)</label>
                                <input type="text" th:field="*{title}" class="form-control" placeholder="VD: Lập trình Java cơ bản đến nâng cao" required>
                                <div class="form-text">Tiêu đề thu hút học viên trên trang chi tiết.</div>
                            </div>
                            <div class="col-12 text-start">
                                <label class="form-label">Mô tả ngắn</label>
                                <textarea th:field="*{description}" class="form-control" rows="4" placeholder="Viết vài dòng giới thiệu về khóa học này..."></textarea>
                            </div>
                        </div>

                        <!-- SECTION: CATEGORY & PRICE -->
                        <div class="section-title">
                            <i class="bi bi-tags-fill"></i> Phân loại & Giá bán
                        </div>
                        <div class="row g-4 mb-5">
                            <div class="col-md-6 text-start">
                                <label class="form-label">Danh mục khóa học</label>
                                <select th:field="*{category.id}" class="form-select" required>
                                    <option value="" disabled selected>-- Chọn danh mục --</option>
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                                </select>
                            </div>
                            <div class="col-md-6 text-start">
                                <label class="form-label">Giá niêm yết (USD)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0" style="border-radius: 12px 0 0 12px;">$</span>
                                    <input type="number" step="0.01" th:field="*{price}" class="form-control border-start-0" placeholder="0.00" style="border-radius: 0 12px 12px 0;" required>
                                </div>
                            </div>
                        </div>

                        <!-- SECTION: MEDIA -->
                        <div class="section-title">
                            <i class="bi bi-images"></i> Hình ảnh & Video giới thiệu
                        </div>
                        <div class="row g-4 mb-5">
                            <div class="col-md-6 text-start">
                                <label class="form-label">Đường dẫn ảnh bìa (URL)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0" style="border-radius: 12px 0 0 12px;"><i class="bi bi-link-45deg"></i></span>
                                    <input type="text" th:field="*{image}" class="form-control border-start-0" placeholder="https://example.com/image.jpg" style="border-radius: 0 12px 12px 0;" required>
                                </div>
                                <div class="mt-3 text-center" th:if="${course.image != null and !#strings.isEmpty(course.image)}">
                                    <img th:src="${course.image}" class="rounded-3 shadow-sm" style="max-width: 100%; height: 120px; object-fit: cover;">
                                </div>
                            </div>
                            <div class="col-md-6 text-start">
                                <label class="form-label">Video giới thiệu (Upload)</label>
                                <input type="file" name="courseVideoFile" class="form-control" accept="video/*">
                                <div class="mt-3" th:if="${course.videoUrl != null and !#strings.isEmpty(course.videoUrl)}">
                                    <div class="alert alert-light border d-flex align-items-center mb-0">
                                        <i class="bi bi-play-circle-fill text-primary me-2"></i>
                                        <span class="small text-truncate me-auto">Video hiện có</span>
                                        <a th:href="${course.videoUrl}" target="_blank" class="btn btn-sm btn-link text-decoration-none fw-bold">Xem phim</a>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <hr class="my-5 opacity-10">

                        <div class="d-flex gap-3">
                            <button type="submit" class="btn btn-primary btn-pill flex-grow-1 shadow-sm">
                                <i class="bi bi-check-circle me-2"></i>Lưu khóa học
                            </button>
                            <a href="/admin/courses" class="btn btn-outline-secondary btn-pill px-4">
                                Hủy bỏ
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
