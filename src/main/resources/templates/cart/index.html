<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng | OnlineCourse</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main-content { flex: 1; }
        
        /* ── Footer ── */
        footer {
            background: #0f172a;
            color: #94a3b8;
            padding: 80px 0 30px;
            margin-top: 80px;
        }
        .footer-brand {
            color: white;
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .footer-link {
            color: #94a3b8;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-block;
            padding: 2px 0;
        }
        .footer-link:hover { color: white; transform: translateX(4px); }
        .social-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: rgba(255,255,255,0.06);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-right: 10px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .social-btn:hover {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            transform: translateY(-4px) scale(1.1);
            border-color: transparent;
            box-shadow: 0 8px 20px rgba(99,102,241,0.3);
        }
        .footer-bottom {
            border-top: 1px solid rgba(255,255,255,0.06);
            margin-top: 50px;
            padding-top: 24px;
        }
        .newsletter-input {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50px;
            padding: 12px 20px;
            color: white;
            font-size: 0.9rem;
        }
        .btn-newsletter {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 50px;
            padding: 10px 24px;
            font-weight: 700;
            color: white;
        }

        /* ── Payment UI ── */
        .fw-800 { font-weight: 800; }
        .fw-900 { font-weight: 900; }
        .fw-700 { font-weight: 700; }
        .fw-500 { font-weight: 500; }
        
        .btn-vnpay {
            background: linear-gradient(135deg, #005baa 0%, #0075d1 100%);
            color: white;
            border: none;
            border-radius: 16px;
            transition: all 0.3s ease;
        }
        .btn-vnpay:hover {
            background: linear-gradient(135deg, #004a8b 0%, #0064b3 100%);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 91, 170, 0.2);
        }
        .btn-vnpay .bg-shape {
            position: absolute;
            right: -20px;
            bottom: -20px;
            width: 100px;
            height: 100px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            z-index: 1;
        }
        .btn-vnpay:disabled { opacity: 0.7; transform: none; box-shadow: none; }
        
        .btn-outline-secondary {
            border-radius: 16px;
            transition: all 0.3s ease;
        }
        .btn-outline-secondary:hover {
            background-color: #f8fafc !important;
            border-color: #6366f1 !important;
            transform: translateY(-2px);
        }
        .method-icon { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar(activePage='cart')}"></div>

<div class="container mt-5 main-content">
    <h2 class="mb-4">Giỏ hàng của bạn</h2>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    
    <div class="row">
        <div class="col-md-8">
            <div class="card shadow-sm border-0 mb-4 p-3" th:if="${cart != null && !#lists.isEmpty(cart.items)}">
                <table class="table table-borderless align-middle mb-0">
                    <thead class="bg-light text-muted">
                        <tr>
                            <th scope="col" style="width: 50%">Khóa học</th>
                            <th scope="col" style="width: 25%">Giá</th>
                            <th scope="col" style="width: 25%">Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${cart.items}" class="border-bottom">
                            <td>
                                <div class="d-flex align-items-center">
                                    <img th:src="${item.course.image}" class="rounded me-3" style="width: 80px; height: 50px; object-fit: cover;">
                                    <span class="fw-bold" th:text="${item.course.title}"></span>
                                </div>
                            </td>
                            <td>
                                <span class="text-danger fw-bold" th:text="${@currencyUtils.formatVnd(item.course.price)}"></span>
                            </td>
                            <td>
                                <form th:action="@{'/cart/remove/' + ${item.id}}" method="post">
                                    <button type="submit" class="btn btn-sm btn-outline-danger shadow-sm">Xóa</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${cart == null || #lists.isEmpty(cart.items)}" class="text-center p-5 bg-white rounded shadow-sm">
                <h4 class="text-muted mb-3">Giỏ hàng trống</h4>
                <a href="/courses" class="btn btn-primary rounded-pill px-4 py-2">Khám phá khóa học ngay</a>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="card-header bg-white border-0 pt-4 px-4 pb-0">
                    <h5 class="fw-800 mb-0">Tóm tắt đơn hàng</h5>
                </div>
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <span class="text-muted fw-500">Tổng thanh toán:</span>
                        <h3 class="text-primary fw-900 mb-0" th:text="${@currencyUtils.formatVnd(cart != null ? cart.totalAmount : 0.0)}">0 VNĐ</h3>
                    </div>

                    <div class="payment-methods mb-4">
                        <p class="small text-uppercase fw-700 text-muted mb-3" style="letter-spacing: 1px;">Phương thức thanh toán</p>
                        
                        <!-- VNPay Card -->
                        <div class="payment-option mb-3">
                            <form th:action="@{/cart/checkout-vnpay}" method="post">
                                <button type="submit" class="btn btn-vnpay w-100 p-3 text-start position-relative overflow-hidden" 
                                        th:disabled="${cart == null || #lists.isEmpty(cart.items)}">
                                    <div class="d-flex align-items-center position-relative" style="z-index: 2;">
                                        <div class="method-icon bg-white rounded-3 shadow-sm me-3 p-2">
                                            <i class="bi bi-qr-code-scan fs-4 text-primary"></i>
                                        </div>
                                        <div>
                                            <div class="fw-700 lh-1 mb-1">Cổng VNPay</div>
                                            <div class="small opacity-75">Thanh toán qua QR, ATM, Thẻ quốc tế</div>
                                        </div>
                                    </div>
                                    <div class="bg-shape"></div>
                                </button>
                            </form>
                        </div>

                        <!-- Demo Card -->
                        <div class="payment-option">
                            <form th:action="@{/cart/checkout}" method="post">
                                <button type="submit" class="btn btn-outline-secondary w-100 p-3 text-start border-2" 
                                        th:disabled="${cart == null || #lists.isEmpty(cart.items)}">
                                    <div class="d-flex align-items-center">
                                        <div class="method-icon bg-light rounded-3 me-3 p-2 text-dark">
                                            <i class="bi bi-rocket-takeoff-fill fs-4"></i>
                                        </div>
                                        <div>
                                            <div class="fw-700 lh-1 mb-1 text-dark">Thanh toán nhanh</div>
                                            <div class="small text-muted">Dùng cho mục đích thử nghiệm (Demo)</div>
                                        </div>
                                    </div>
                                </button>
                            </form>
                        </div>
                    </div>

                    <p class="text-center small text-muted mb-0">
                        <i class="bi bi-shield-lock-fill me-1"></i> Thanh toán an toàn & bảo mật
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

    <div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
