<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa Hồ sơ | OnlineCourse</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .card { border-radius: 20px; border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .form-label { font-weight: 600; color: #4b5563; }
        .form-control { border-radius: 12px; padding: 12px 16px; border: 1px solid #e5e7eb; }
        .form-control:focus { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
        .btn-pill { border-radius: 50px; padding: 12px 24px; font-weight: 700; }
        .section-title { font-size: 1.1rem; font-weight: 700; color: #1f2937; margin-bottom: 2rem; display: flex; align-items: center; gap: 10px; }
        .section-title i { color: #6366f1; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar(activePage='account')}"></div>

<div class="container mt-5 pb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/account" class="text-decoration-none">Tài khoản</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Chỉnh sửa hồ sơ</li>
                </ol>
            </nav>

            <div class="card p-4 p-md-5">
                <div class="section-title">
                    <i class="bi bi-person-gear fs-4"></i> Cập nhật thông tin cá nhân
                </div>

                <form th:action="@{/account/edit}" th:object="${user}" method="POST">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label">Họ và Tên</label>
                            <input type="text" th:field="*{fullname}" class="form-control" placeholder="VD: Nguyễn Văn A">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email (Không thể thay đổi)</label>
                            <input type="email" th:field="*{email}" class="form-control" readonly disabled>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Số điện thoại</label>
                            <input type="tel" th:field="*{phoneNumber}" class="form-control" placeholder="VD: 0901234567">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Địa chỉ</label>
                            <input type="text" th:field="*{address}" class="form-control" placeholder="VD: Quận 1, TP.HCM">
                        </div>
                        
                        <div class="col-12 mt-5">
                            <div class="d-flex gap-3">
                                <button type="submit" class="btn btn-primary btn-pill flex-grow-1 shadow-sm">
                                    <i class="bi bi-check-circle me-2"></i>Lưu thay đổi
                                </button>
                                <a href="/account" class="btn btn-outline-secondary btn-pill px-4">
                                    Hủy bỏ
                                </a>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <div class="mt-4 alert alert-light border rounded-3 p-3 text-center">
                <p class="mb-0 small text-muted">
                    <i class="bi bi-shield-lock me-1"></i> Thông tin của bạn được bảo mật tuyệt đối. Chúng tôi không bao giờ chia sẻ thông tin cá nhân của bạn với bên thứ ba.
                </p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
